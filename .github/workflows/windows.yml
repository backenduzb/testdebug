name: Windows build and test
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Use supported Python for aqt
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'
          extra: '--external 7z'
          setup-python: false
          cache: false
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Deploy portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/GeminiVisionPracticeAssistant.exe dist/
          windeployqt --release --no-translations dist/GeminiVisionPracticeAssistant.exe
      - name: Publish public EXE release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/GeminiVisionPracticeAssistant.exe
