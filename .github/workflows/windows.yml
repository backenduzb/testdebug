name: Windows build and test
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Use supported Python for aqt
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          aqtversion: '==3.3.*'
          py7zrversion: '==1.1.0'
          extra: '--external 7z'
          setup-python: false
          cache: false
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Deploy portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = 'build/Release/GeminiVisionPracticeAssistant.exe'
          if (!(Test-Path $exe)) { throw "Build output not found: $exe" }
          Copy-Item $exe dist/
          windeployqt --release --compiler-runtime --no-translations --no-system-d3d-compiler dist/GeminiVisionPracticeAssistant.exe
          $required = @(
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'Qt6Network.dll',
            'platforms/qwindows.dll'
          )
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path dist $file))) { throw "Missing deployed Qt runtime file: $file" }
          }
          Get-ChildItem dist -Recurse
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc (Join-Path $pwd 'installer/GeminiVisionPracticeAssistant.iss')
          $installer = 'installer/installer-output/GeminiVisionPracticeAssistant-Setup.exe'
          if (!(Test-Path $installer)) { throw "Installer was not created: $installer" }
      - name: Publish public EXE release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: installer/installer-output/GeminiVisionPracticeAssistant-Setup.exe
