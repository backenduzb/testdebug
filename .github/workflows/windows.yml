name: Windows build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          arch: win64_msvc2022_64
          modules: 'qtnetwork qttools'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release
      - name: Deploy portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/GeminiVisionPracticeAssistant.exe dist/
          windeployqt --release --no-translations dist/GeminiVisionPracticeAssistant.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiVisionPracticeAssistant-windows
          path: dist
